  # ── Financial ─────────────────────────────────────────────────────────────────

  /tuitions:
    get:
      tags: [Financial]
      summary: Listar mensalidades
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 100, maximum: 200 }
        - name: status
          in: query
          schema: { type: string, enum: [pending, paid, overdue] }
      responses:
        '200':
          description: Lista de mensalidades
    post:
      tags: [Financial]
      summary: Criar mensalidade
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                studentId: { type: string, format: uuid }
                amount: { type: number, exclusiveMinimum: 0 }
                dueDate: { type: string, format: date }
              required: [studentId, amount, dueDate]
      responses:
        '201':
          description: Mensalidade criada

  /tuitions/{id}:
    patch:
      tags: [Financial]
      summary: Atualizar mensalidade
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { type: number }
                dueDate: { type: string, format: date }
      responses:
        '200':
          description: Mensalidade atualizada
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Não é possível alterar mensalidade paga

  /tuitions/{id}/pay:
    patch:
      tags: [Financial]
      summary: Registrar pagamento
      security: [{ bearerAuth: [] }]
      parameters:
