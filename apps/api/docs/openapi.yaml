components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ValidationError:
      description: Erro de validação
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string, example: Validation error }
              issues:
                type: array
                items: { type: object }
    Unauthorized:
      description: Não autenticado
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              example: { message: Unauthorized }
    Forbidden:
      description: Sem permissão
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              example: { message: Forbidden }
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              example: { message: Not found }
