services:
  # S3-compatible storage (simula AWS S3 / DO Spaces em dev)
  minio:
    image: minio/minio:latest
    container_name: education-gestor-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5

  init-minio:
    image: minio/mc:latest
    container_name: education-gestor-init-minio
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        echo 'Creating MinIO alias...' &&
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        echo 'Creating bucket...' &&
        mc mb local/education-gestor --ignore-existing &&
        echo 'Setting bucket to public...' &&
        mc anonymous set public local/education-gestor &&
        echo 'MinIO setup complete.'
      "

  # Banco de dados
  db:
    image: postgres:16
    container_name: education-gestor-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: education_gestor
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d education_gestor']
      interval: 5s
      timeout: 5s
      retries: 5

  db-test:
    image: postgres:16
    container_name: education-gestor-db-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: education_gestor_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d education_gestor_test']
      interval: 5s
      timeout: 5s
      retries: 5

  # API (Fastify)
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: education-gestor-api
    environment:
      NODE_ENV: development
      PORT: '3333'
      DATABASE_URL: postgresql://postgres:postgres@db:5432/education_gestor
      DATABASE_URL_TEST: postgresql://postgres:postgres@db-test:5432/education_gestor_test
      JWT_SECRET: supersecretkey_change_in_production_minimum_32_chars
      DO_SPACES_ENDPOINT: http://minio:9000
      DO_SPACES_BUCKET: education-gestor
      DO_SPACES_REGION: us-east-1
      DO_SPACES_KEY: minioadmin
      DO_SPACES_SECRET: minioadmin
      DO_SPACES_CDN_URL: http://localhost:9000/education-gestor
    ports:
      - '3333:3333'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/types/node_modules
    depends_on:
      db:
        condition: service_healthy
      init-minio:
        condition: service_completed_successfully
    command: pnpm --filter api dev

  # Frontend (Vite)
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: education-gestor-web
    environment:
      NODE_ENV: development
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/types/node_modules
    depends_on:
      - api
    command: pnpm --filter web dev

volumes:
  postgres_data:
  minio_data:
